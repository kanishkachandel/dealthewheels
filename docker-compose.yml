services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://dealthewheels:dealthewheels@postgres:5432/dealthewheels
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-before-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dealthewheels
      POSTGRES_USER: dealthewheels
      POSTGRES_PASSWORD: dealthewheels
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealthewheels -d dealthewheels"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
